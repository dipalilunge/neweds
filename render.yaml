services:
  - type: web
    name: engineering-design-studio
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /
    envVars:
      - key: EDS_SECRET_KEY
        generateValue: true
      - key: EDS_ADMIN_PASSWORD
        sync: false
      - key: EDS_STUDENT_PASSWORD
        sync: false
      - key: EDS_ADMISSIONS_SHEET_ID
        value: 1YBCkcWHIPdDpakjIm3J8hB_WRlLT8NxoY6nzde6CtIE
      - key: EDS_ADMISSIONS_WORKSHEET
        value: Admissions
      - key: EDS_SERVICES_SHEET_ID
        value: 1RVHEUbSoEpmUX3u3JIjcRI8uPt3O2VBCVvkU26yIjpM
      - key: EDS_SERVICES_WORKSHEET
        value: Service Inquiries
      - key: EDS_GOOGLE_CREDENTIALS_JSON
        sync: false
